name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to attach files to a release when a v* tag is pushed

# Code signing is optional and turns on when its secrets exist (see SIGNING.md). Without them the
# builds are unsigned: they work, but Windows SmartScreen and macOS Gatekeeper warn on first launch.

jobs:
  windows:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.1.0" >> "$GITHUB_OUTPUT"; fi
      - name: Build ShowTell.exe
        shell: pwsh
        run: ./windows/build-exe.ps1 -Version ${{ steps.v.outputs.version }} -NoZip
      - name: Sign ShowTell.exe (Azure Artifact Signing)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process windows/dist/ShowTell.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\ShowTell\selftest.txt"
          exit $p.ExitCode
      - name: Zip
        shell: pwsh
        run: |
          Get-AuthenticodeSignature windows/dist/ShowTell.exe | Format-List Status, SignerCertificate
          Compress-Archive -Path windows/dist/ShowTell.exe -DestinationPath windows/dist/ShowTell-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ShowTell-windows-x64
          path: windows/dist/ShowTell-windows-x64.zip

  macos:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.1.0" >> "$GITHUB_OUTPUT"; fi
      - name: Import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$ID" ]; then echo "No Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Build ShowTell.app (universal)
        working-directory: macos
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: bash ./build.sh
      - name: Self-test
        run: macos/dist/ShowTell.app/Contents/MacOS/ShowTell --selftest
      - name: Speech-to-text test (downloads Parakeet)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          say -o "$RUNNER_TEMP/speech.wav" --data-format=LEI16@16000 "I really like the header on this website. Please copy the font and the blue gradient button."
          macos/dist/ShowTell.app/Contents/MacOS/ShowTell --selftest "transcribe=$RUNNER_TEMP/speech.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: ShowTell-macos
          path: |
            macos/dist/ShowTell-macos.dmg
            macos/dist/ShowTell-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Windows:** unzip `ShowTell-windows-x64.zip` and run `ShowTell.exe`. If SmartScreen says "Windows protected your PC", click **More info → Run anyway**.

            **macOS:** open `ShowTell-macos.dmg` and drag ShowTell to Applications. If macOS says Apple could not verify ShowTell, click **Done**, then **System Settings → Privacy & Security → Open Anyway**. See the README for details and SIGNING.md for signed builds.
